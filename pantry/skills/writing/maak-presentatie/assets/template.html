<!DOCTYPE html>
<!--
  PRESENTATIE-TEMPLATE — design system Flux (Departement Omgeving), release 2.19.0
  Bron: https://claude.ai/code/artifact/03ba8e3a-b7b7-47d1-9e06-34671e367b04

  Invullen:
  - Vervang elke "VUL IN"-comment door inhoud en verwijder de comment.
  - Behoud per slide de structuur <section class="slide"><div class="canvas s-…">.
  - Verwijder de slidetypes die je niet gebruikt; laat hun CSS staan.
  - Geef elke slide een oplopende id: slide-1, slide-2, …
  - NIET verwijderen: meta charset, de token-block, de @font-face-regels,
    het navigatiescript, de HUD en de print-styles.
  - Geen externe resources: het bestand moet standalone in een browser werken.
  - Na het invullen: scripts/afwerken.py <bestand> — dat bakt de fonts in als
    base64 en controleert op achtergebleven placeholders.

  Formaat: <html data-format="slide"> = 16:9 (standaard), data-format="a4" = A4 landscape.
  Stijl:   <html data-stijl="domg"> = huisstijl Departement Omgeving (standaard),
           data-stijl="stencil" = neutrale postervariant.
-->
<html lang="nl" data-format="slide" data-stijl="domg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- VUL IN: titel van de presentatie --></title>
<style>
  /* ── Flanders Art Sans — ingebakken door scripts/afwerken.py ───────────── */
  @font-face { font-family: "Flanders Art Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url(__FONT_REGULAR__) format("woff2"); }
  @font-face { font-family: "Flanders Art Sans"; font-weight: 500; font-style: normal; font-display: swap; src: url(__FONT_MEDIUM__) format("woff2"); }
  @font-face { font-family: "Flanders Art Sans"; font-weight: 700; font-style: normal; font-display: swap; src: url(__FONT_BOLD__) format("woff2"); }

  /* Stencil-variant — SIL Open Font License, zie assets/fonts/LICENTIES.md */
  @font-face { font-family: "Bebas Neue"; font-weight: 400; font-style: normal; font-display: swap; src: url(__FONT_DISPLAY__) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; font-display: swap; src: url(__FONT_COND_600__) format("woff2"); }
  @font-face { font-family: "Barlow Condensed"; font-weight: 800; font-style: normal; font-display: swap; src: url(__FONT_COND_800__) format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap; src: url(__FONT_INTER__) format("woff2"); }

  /* ── Flux-tokens (release 2.19.0) ─────────────────────────────────────── */
  :root {
    --vl-color--white:        #ffffff;
    --vl-color--grey-100:     #f7f9fc;
    --vl-color--grey-200:     #eceff4;
    --vl-color--grey-300:     #cfd5dd;
    --vl-color--grey-600:     #8695a8;
    --vl-color--grey-800:     #687483;
    --vl-color--grey-1000:    #333332;
    --vl-color--primary:      #ffed00;
    --vl-color--on-primary:   #333332;
    --vl-color--action:       #0055cc;
    --vl-color--focus:        rgba(0, 85, 204, .65);
    --vl-color--error-700:    #bc3136;
    --vl-color--warning-800:  #9f5804;
    --vl-color--success-800:  #007a37;

    --vl-color--domg-hoofdkleur:             #447a6d;
    --vl-color--domg-hoofdkleur-light:       #47a491;
    --vl-color--domg-hoofdkleur-extra-light: #56baa4;
    --vl-color--domg-steunkleur:             #6c5a44;
    --vl-color--domg-steunkleur-light:       #a67d43;

    --vl-color--text-default: var(--vl-color--grey-1000);
    --vl-color--text-subtle:  rgba(0, 20, 46, .6);
    --vl-color--text-inverse: var(--vl-color--white);
    --vl-color--border-default: var(--vl-color--grey-300);
    --vl-color--background-default: var(--vl-color--white);
    --vl-color--background-subtle:  var(--vl-color--grey-100);

    --vl-border--radius: 3px;
    --vl-border--width:  1px;

    --accent: var(--vl-color--domg-hoofdkleur);
  }

  /* ── Canvas: alle maten zijn Flux-px op een canvas van 1024 breed ──────── */
  /* var(--px) = 1 canvas-px. Schaalt mee met de slidebreedte (container query). */

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--vl-color--grey-200);
    color: var(--vl-color--text-default);
    font-family: "Flanders Art Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .deck {
    height: 100svh;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
  }
  @media (prefers-reduced-motion: reduce) { .deck { scroll-behavior: auto; } }

  .slide {
    height: 100svh;
    display: grid;
    place-items: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }

  .canvas {
    position: relative;
    overflow: hidden;
    container-type: inline-size;
    --px: calc(100cqi / 1024);
    aspect-ratio: 16 / 9;
    width: min(100%, calc(100svh * 16 / 9));
    background: var(--vl-color--background-default);
    padding: calc(60 * var(--px)) calc(72 * var(--px));
    display: flex;
    flex-direction: column;
    gap: calc(20 * var(--px));
  }
  [data-format="a4"] .canvas {
    aspect-ratio: 297 / 210;
    width: min(100%, calc(100svh * 297 / 210));
  }

  /* ── Typografie (Flux-schaal, verbatim) ───────────────────────────────── */
  h1, h2, h3, h4, p, ul, ol, figure, table { margin: 0; }
  h1 { font-size: calc(44 * var(--px)); line-height: 1.18; font-weight: 500; }
  h2 { font-size: calc(32 * var(--px)); line-height: 1.24; font-weight: 500; }
  h3 { font-size: calc(26 * var(--px)); line-height: 1.30; font-weight: 500; }
  h4 { font-size: calc(22 * var(--px)); line-height: 1.36; font-weight: 500; }
  p, li, td, th { font-size: calc(18 * var(--px)); line-height: 1.5; }
  .lead    { font-size: calc(22 * var(--px)); line-height: 1.5; }
  .small   { font-size: calc(16 * var(--px)); line-height: 1.5; }
  .xsmall  { font-size: calc(14 * var(--px)); line-height: 1.5; color: var(--vl-color--text-subtle); }
  .subtle  { color: var(--vl-color--text-subtle); }
  strong   { font-weight: 700; }

  .eyebrow {
    font-size: calc(16 * var(--px));
    font-weight: 500;
    color: var(--accent);
  }
  .rule {
    width: calc(60 * var(--px));
    height: calc(4 * var(--px));
    background: var(--accent);
    border: 0;
    margin: 0;
  }

  /* ── Lijsten ──────────────────────────────────────────────────────────── */
  ul.bullets, ol.bullets { padding-left: calc(24 * var(--px)); display: flex; flex-direction: column; gap: calc(15 * var(--px)); }
  ul.bullets > li { font-size: calc(22 * var(--px)); line-height: 1.45; }
  ol.bullets > li { font-size: calc(22 * var(--px)); line-height: 1.45; }
  ul.bullets > li::marker { color: var(--accent); }
  ol.bullets > li::marker { color: var(--accent); font-weight: 700; }
  li > .sub { display: block; font-size: calc(18 * var(--px)); color: var(--vl-color--text-subtle); margin-top: calc(5 * var(--px)); }

  /* ── Figuren ──────────────────────────────────────────────────────────── */
  /* Eén SVG-eenheid = één canvas-px: viewBox="0 0 880 H" (880 = 1024 - 2x72
     padding). Dus font-size="18" in de SVG is exact Flux' body, 16 is
     text-small, 14 is text-xsmall. Kleur via classes, nooit via fill="var(…)":
     var() werkt niet in een SVG-presentatieattribuut. */
  .fig { width: 100%; height: auto; display: block; }
  .fig text { fill: var(--vl-color--text-default); }
  .fig .label { font-weight: 500; }
  .fig .toel { fill: var(--vl-color--text-subtle); }
  .fig .op-accent { fill: var(--vl-color--text-inverse); }
  .fig .box { fill: var(--vl-color--background-subtle); stroke: var(--vl-color--border-default); stroke-width: 1.5; }
  .fig .box-accent { fill: var(--accent); stroke: var(--accent); stroke-width: 1.5; }
  .fig .box-open { fill: none; stroke: var(--vl-color--border-default); stroke-width: 1.5; }
  /* Gestreept = wat nog niet bestaat of wegvalt. Vervagen doe je met de
     grijsschaal, niet met opacity. */
  .fig .box-faded { fill: none; stroke: var(--vl-color--grey-300); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .fig .arrow { stroke: var(--vl-color--grey-600); stroke-width: 1.5; fill: none; }
  .fig .arrow-faded { stroke: var(--vl-color--grey-300); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
  .fig .arrow-head { fill: var(--vl-color--grey-600); stroke: none; }
  .fig .arrow-head-faded { fill: var(--vl-color--grey-300); stroke: none; }

  /* ── 1. Titelslide ────────────────────────────────────────────────────── */
  .s-title { justify-content: center; gap: calc(15 * var(--px)); }
  .s-title h1 { font-size: calc(56 * var(--px)); line-height: 1.1; max-width: 85%; }
  .s-title .lead { max-width: 75%; }
  .s-title .meta { margin-top: calc(30 * var(--px)); font-size: calc(16 * var(--px)); color: var(--vl-color--text-subtle); }
  .s-title::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: calc(14 * var(--px)); background: var(--vl-color--primary);
  }

  /* ── 2. Sectiedivider ─────────────────────────────────────────────────── */
  .s-section {
    background: var(--accent);
    color: var(--vl-color--text-inverse);
    justify-content: center;
    gap: calc(10 * var(--px));
  }
  .s-section .eyebrow { color: rgba(255, 255, 255, .8); }
  .s-section h2 { font-size: calc(44 * var(--px)); max-width: 80%; }
  .s-section .num { font-size: calc(18 * var(--px)); font-weight: 700; letter-spacing: .04em; }
  .s-section .rule { background: var(--vl-color--primary); }

  /* ── 3. Kop + bullets ─────────────────────────────────────────────────── */
  .s-bullets { justify-content: flex-start; }
  .s-bullets ul, .s-bullets ol { margin-top: calc(10 * var(--px)); }

  /* ── 4. Twee kolommen ─────────────────────────────────────────────────── */
  .s-two .cols {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: calc(30 * var(--px));
    margin-top: calc(10 * var(--px));
  }
  .col {
    border: var(--vl-border--width) solid var(--vl-color--border-default);
    border-radius: var(--vl-border--radius);
    padding: calc(20 * var(--px));
    display: flex; flex-direction: column; gap: calc(10 * var(--px));
  }
  .col.plain { border: 0; padding: 0; }
  .col.filled { background: var(--vl-color--background-subtle); border-color: transparent; }
  .col h3 { font-size: calc(22 * var(--px)); }

  /* ── 5. Statement ─────────────────────────────────────────────────────── */
  .s-statement { justify-content: center; align-items: flex-start; }
  .s-statement blockquote {
    margin: 0; max-width: 88%;
    font-size: calc(36 * var(--px)); line-height: 1.3; font-weight: 500;
  }
  .s-statement .bron { font-size: calc(16 * var(--px)); color: var(--vl-color--text-subtle); }

  /* ── 6. Cijfers / KPI ─────────────────────────────────────────────────── */
  .s-kpi .kpis {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: calc(20 * var(--px)); margin-top: calc(20 * var(--px));
  }
  .kpi {
    border-top: calc(4 * var(--px)) solid var(--accent);
    padding-top: calc(15 * var(--px));
    display: flex; flex-direction: column; gap: calc(5 * var(--px));
  }
  .kpi .cijfer { font-size: calc(64 * var(--px)); line-height: 1; font-weight: 500; color: var(--accent); }
  .kpi .label  { font-size: calc(18 * var(--px)); font-weight: 500; }
  .kpi .toelichting { font-size: calc(14 * var(--px)); color: var(--vl-color--text-subtle); }

  /* ── 7. Tabel ─────────────────────────────────────────────────────────── */
  .s-table table { width: 100%; border-collapse: collapse; margin-top: calc(10 * var(--px)); }
  .s-table caption { text-align: left; font-size: calc(14 * var(--px)); color: var(--vl-color--text-subtle); padding-bottom: calc(10 * var(--px)); }
  .s-table th, .s-table td {
    text-align: left; padding: calc(10 * var(--px)) calc(15 * var(--px));
    border-bottom: var(--vl-border--width) solid var(--vl-color--border-default);
    font-size: calc(18 * var(--px));
  }
  .s-table thead th { background: var(--vl-color--background-subtle); font-weight: 500; }
  .s-table td.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* ── 8. Beeld volvlak ─────────────────────────────────────────────────── */
  .s-image { padding: 0; }
  .s-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .s-image figcaption {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: var(--vl-color--grey-1000); color: var(--vl-color--text-inverse);
    padding: calc(15 * var(--px)) calc(72 * var(--px));
    font-size: calc(16 * var(--px));
  }
  .s-image figure { width: 100%; height: 100%; }

  /* ── 9. Slotslide ─────────────────────────────────────────────────────── */
  .s-end {
    background: var(--accent); color: var(--vl-color--text-inverse);
    justify-content: center; gap: calc(15 * var(--px));
  }
  .s-end h2 { font-size: calc(44 * var(--px)); }
  .s-end .rule { background: var(--vl-color--primary); }
  .s-end a { color: var(--vl-color--white); }

  /* ── 10. Figuur ───────────────────────────────────────────────────────── */
  .s-figure { justify-content: flex-start; }
  .s-figure figure { margin-top: calc(10 * var(--px)); }
  .s-figure figcaption { font-size: calc(14 * var(--px)); color: var(--vl-color--text-subtle); margin-top: calc(10 * var(--px)); }

  /* ── Statuskleuren (spaarzaam, nooit kleur alleen) ────────────────────── */
  .is-error   { color: var(--vl-color--error-700); }
  .is-warning { color: var(--vl-color--warning-800); }
  .is-success { color: var(--vl-color--success-800); }

  /* ── HUD: teller ──────────────────────────────────────────────────────── */
  .hud {
    position: fixed; right: 20px; bottom: 28px;
    background: var(--vl-color--white);
    border: 1px solid var(--vl-color--border-default);
    border-radius: var(--vl-border--radius);
    padding: 4px 10px;
    font-size: 14px; font-variant-numeric: tabular-nums;
    color: var(--vl-color--text-subtle);
    user-select: none;
  }
  .hud b { font-weight: 500; color: var(--vl-color--text-default); }

  :focus-visible { outline: 3px solid var(--vl-color--focus); outline-offset: 2px; }

  /* ══ Stijlvariant "stencil" ═════════════════════════════════════════════
     Neutrale postervariant: beenwit vlak, zwarte sectieschermen, verzadigde
     kleurkaarten, gecondenseerde kapitalen. Zelfde slidetypes en dezelfde
     scaffolds — alleen tokens en lettertypes verschillen. Geen logo's, geen
     merkverwijzingen. Tekst op een donker vlak is beenwit, nooit wit. */
  :root[data-stijl="stencil"] {
    --bone:    #e2dcc9;
    --paper:   #f4efe0;
    --ink:     #0a0a0a;
    --oranje:  #ee7a2e;
    --teal:    #2d7e73;
    --magenta: #c73b7a;
    --mosterd: #d8a93b;
    --blauw:   #3f73b7;
    --olijf:   #6f7a2e;
    --sienna:  #a06a3c;

    --vl-color--background-default: var(--bone);
    --vl-color--background-subtle:  var(--paper);
    --vl-color--text-default:  var(--ink);
    --vl-color--text-inverse:  var(--bone);
    --vl-color--text-subtle:   rgba(10, 10, 10, .62);
    --vl-color--border-default: rgba(10, 10, 10, .35);
    --vl-color--grey-1000: var(--ink);
    --vl-color--white: var(--bone);
    --vl-color--primary: var(--mosterd);
    --vl-border--radius: 22px;
    --vl-border--width: 2px;
    --accent: var(--oranje);
  }

  [data-stijl="stencil"] body { background: #cfc7b0; }

  [data-stijl="stencil"] h1,
  [data-stijl="stencil"] h2,
  [data-stijl="stencil"] h3,
  [data-stijl="stencil"] h4,
  [data-stijl="stencil"] blockquote,
  [data-stijl="stencil"] .cijfer,
  [data-stijl="stencil"] .num {
    font-family: "Bebas Neue", "Barlow Condensed", sans-serif;
    font-weight: 400;
    text-transform: uppercase;
    line-height: 1.02;
  }
  [data-stijl="stencil"] p,
  [data-stijl="stencil"] li,
  [data-stijl="stencil"] td,
  [data-stijl="stencil"] th { font-family: "Inter", sans-serif; }
  [data-stijl="stencil"] .eyebrow,
  [data-stijl="stencil"] .kpi .label,
  [data-stijl="stencil"] .s-table thead th,
  [data-stijl="stencil"] .hud {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  /* Schaal: de bron rekent op 1920 breed, dit canvas is 1024. Koppen gaan mee
     omhoog, lopende tekst niet — anders is ze op een beamer onleesbaar. */
  [data-stijl="stencil"] h1 { font-size: calc(104 * var(--px)); }
  [data-stijl="stencil"] h2 { font-size: calc(72 * var(--px)); }
  [data-stijl="stencil"] h3 { font-size: calc(34 * var(--px)); }
  [data-stijl="stencil"] .s-title h1 { font-size: calc(104 * var(--px)); max-width: 95%; }
  /* Op een figuurslide is de hoogte voor de figuur: kop kleiner dan elders. */
  [data-stijl="stencil"] .s-figure h2 { font-size: calc(50 * var(--px)); }
  [data-stijl="stencil"] .s-bullets h2,
  [data-stijl="stencil"] .s-two h2,
  [data-stijl="stencil"] .s-kpi h2,
  [data-stijl="stencil"] .s-table h2 { font-size: calc(58 * var(--px)); }
  [data-stijl="stencil"] .s-section h2,
  [data-stijl="stencil"] .s-end h2 { font-size: calc(88 * var(--px)); max-width: 92%; }
  [data-stijl="stencil"] .s-statement blockquote { font-size: calc(60 * var(--px)); line-height: 1.06; }
  [data-stijl="stencil"] .kpi .cijfer { font-size: calc(132 * var(--px)); color: var(--ink); }
  [data-stijl="stencil"] .eyebrow { font-size: calc(18 * var(--px)); color: var(--ink); }

  [data-stijl="stencil"] .rule { width: calc(96 * var(--px)); height: calc(10 * var(--px)); background: var(--accent); }
  [data-stijl="stencil"] .s-title::after { background: var(--mosterd); height: calc(28 * var(--px)); }

  /* Sectiescherm: zwart vlak, reusachtig nummer in de accentkleur. */
  [data-stijl="stencil"] .s-section { background: #000; }
  [data-stijl="stencil"] .s-section .num { font-size: calc(200 * var(--px)); color: var(--accent); letter-spacing: -.02em; }
  [data-stijl="stencil"] .s-section .eyebrow { color: var(--bone); }
  [data-stijl="stencil"] .s-section .rule { background: var(--mosterd); }

  /* Slot: volvlak in de accentkleur, tekst in inkt. */
  [data-stijl="stencil"] .s-end { background: var(--accent); color: var(--ink); }
  [data-stijl="stencil"] .s-end .rule { background: var(--ink); }
  [data-stijl="stencil"] .s-end a { color: var(--ink); }

  /* Statement: paneel in magenta, tekst beenwit. */
  [data-stijl="stencil"] .s-statement { background: var(--magenta); color: var(--bone); }
  [data-stijl="stencil"] .s-statement .rule { background: var(--mosterd); }
  [data-stijl="stencil"] .s-statement .bron { color: rgba(226, 220, 201, .75); }

  /* Kaarten: vlakke blokken verzadigde kleur, geen schaduw. */
  [data-stijl="stencil"] .col { background: var(--paper); border: var(--vl-border--width) solid var(--ink); }
  [data-stijl="stencil"] .col.filled { background: var(--accent); border-color: var(--ink); }
  [data-stijl="stencil"] .kpi { border-top-width: calc(10 * var(--px)); }

  [data-stijl="stencil"] .s-table th,
  [data-stijl="stencil"] .s-table td { border-bottom: 2px solid var(--ink); }
  [data-stijl="stencil"] .s-table thead th { background: var(--accent); }

  [data-stijl="stencil"] .hud {
    background: var(--paper);
    border: 2px solid var(--ink);
    border-radius: 999px;
    color: var(--ink);
  }
  [data-stijl="stencil"] .hud b { color: var(--ink); }

  /* Figuren: dikke inktlijnen, ruimere ronding, kapitalen in de labels. */
  [data-stijl="stencil"] .fig .box { fill: var(--paper); stroke: var(--ink); stroke-width: 2; rx: 14px; }
  [data-stijl="stencil"] .fig .box-accent { fill: var(--accent); stroke: var(--ink); stroke-width: 2; rx: 14px; }
  [data-stijl="stencil"] .fig .box-open { fill: none; stroke: var(--ink); stroke-width: 2; rx: 14px; }
  [data-stijl="stencil"] .fig .box-faded { fill: none; stroke: rgba(10, 10, 10, .35); stroke-width: 2; stroke-dasharray: 6 5; rx: 14px; }
  [data-stijl="stencil"] .fig .arrow { stroke: var(--ink); stroke-width: 2; }
  [data-stijl="stencil"] .fig .arrow-faded { stroke: rgba(10, 10, 10, .35); stroke-width: 2; }
  [data-stijl="stencil"] .fig .arrow-head { fill: var(--ink); }
  [data-stijl="stencil"] .fig .arrow-head-faded { fill: rgba(10, 10, 10, .35); }
  [data-stijl="stencil"] .fig .label { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
  [data-stijl="stencil"] .fig .toel { font-family: "Inter", sans-serif; }
  /* De accentkleur is licht: tekst erop is inkt, niet beenwit. */
  [data-stijl="stencil"] .fig .op-accent { fill: var(--ink); }

  /* ── Print: één slide per pagina ──────────────────────────────────────── */
  @media print {
    body { background: #fff; }
    .deck { height: auto; overflow: visible; }
    .slide { height: auto; display: block; break-after: page; page-break-after: always; }
    .slide:last-child { break-after: auto; page-break-after: auto; }
    .canvas { width: 100%; box-shadow: none; }
    .hud { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<style id="pagestyle"></style>
</head>

<div class="hud" aria-live="polite" aria-atomic="true">
  <b id="hud-current">1</b> / <span id="hud-total">1</span>
</div>

<script>
(function () {
  var deck = document.getElementById('deck');
  var slides = Array.prototype.slice.call(deck.querySelectorAll('.slide'));
  var cur = document.getElementById('hud-current');
  var tot = document.getElementById('hud-total');
  var index = 0;
  tot.textContent = slides.length;

  // Paginamaat volgt data-format; @page kan geen attribuut lezen, dus hier gezet.
  var formaat = document.documentElement.getAttribute('data-format') === 'a4'
    ? 'A4 landscape'
    : '338.66mm 190.5mm';
  document.getElementById('pagestyle').textContent =
    '@page { size: ' + formaat + '; margin: 0; }';

  function toon(i) {
    index = Math.max(0, Math.min(slides.length - 1, i));
    cur.textContent = index + 1;
    if (slides[index].id) {
      history.replaceState(null, '', '#' + slides[index].id);
    }
  }

  function ga(i) {
    if (i < 0 || i >= slides.length) return;
    slides[i].scrollIntoView({ block: 'start' });
    toon(i);
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) toon(slides.indexOf(e.target));
      });
    }, { root: deck, threshold: 0.5 });
    slides.forEach(function (s) { io.observe(s); });
  }

  // Enkel cmd + > en cmd + <. Op event.key, niet event.code: op AZERTY
  // delen < en > één toets. Scrollen met muis of trackpad blijft werken.
  document.addEventListener('keydown', function (e) {
    if (!e.metaKey || e.altKey || e.ctrlKey) return;
    var k = e.key;
    if (k === '>' || k === '.') { e.preventDefault(); ga(index + 1); }
    else if (k === '<' || k === ',') { e.preventDefault(); ga(index - 1); }
  });

  // Diepe link: #slide-3 opent op die slide. De sprong moet hard zijn: met een
  // vloeiende scroll ziet de observer eerst slide 1 en schrijft die de hash terug.
  var start = -1;
  for (var i = 0; i < slides.length; i++) {
    if ('#' + slides[i].id === location.hash) { start = i; break; }
  }
  if (start > 0) { deck.scrollTo({ top: slides[start].offsetTop, behavior: 'instant' }); toon(start); }
  else { toon(0); }

  // Een andere #slide-N in de adresbalk laadt de pagina niet opnieuw: zelf opvangen.
  // toon() schrijft de hash met replaceState, en dat vuurt geen hashchange.
  window.addEventListener('hashchange', function () {
    for (var j = 0; j < slides.length; j++) {
      if ('#' + slides[j].id === location.hash && j !== index) {
        deck.scrollTo({ top: slides[j].offsetTop, behavior: 'instant' });
        toon(j);
        return;
      }
    }
  });
})();
</script>
