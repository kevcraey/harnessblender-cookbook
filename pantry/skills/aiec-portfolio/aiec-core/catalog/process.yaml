      "rule": "Een ad-hocvraag wordt geen initiatief maar een Task onder epic AI-95 (Ad-hocvragen, onder AI-48): de vraag in één zin, uren op de task. Ze staat maximaal 30 dagen open en wordt dan afgesloten of gepromoveerd. Promoveren kan wanneer de opdrachtgever er waarde van verwacht en bevestigt dat die er de nodige inspanning en prioriteit aan geeft. Promotie tot initiatief gebeurt door het issuetype naar Initiative te wijzigen (zelfde key, via Jira-Move), niet door sluiten en linken."
