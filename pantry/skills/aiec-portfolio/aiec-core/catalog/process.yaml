  "decided": [
    {
      "id": "instroom",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "Een ad-hocvraag wordt geen initiatief maar een Task onder epic AI-95 (Ad-hocvragen, onder AI-48): de vraag in één zin, uren op de task. Ze staat maximaal 30 dagen open en wordt dan afgesloten of gepromoveerd. Promoveren kan wanneer de opdrachtgever er waarde van verwacht en bevestigt dat die er de nodige inspanning en prioriteit aan geeft. Promotie tot initiatief gebeurt door het issuetype naar Initiative te wijzigen (zelfde key, via Jira-Move), niet door sluiten en linken."
    },
    {
      "id": "resoluties",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "Eén Jira-resolution per afsluitcategorie: uitgevoerd → 'uitgevoerd', stopgezet → 'Stopgezet', geannuleerd → 'geannuleerd'. Een initiatief afgesloten met een andere resolution is een reviewmelding om recht te zetten."
    },
    {
      "id": "parkeren",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "Geen parkeerstatus. Wat nu niet kan, wordt afgesloten als stopgezet met een stopreden (bv. geen capaciteit). Hervatten gebeurt via de transitie naar Captatie met een nieuwe beslissing; dezelfde key en geschiedenis blijven. 'stilgevallen' (90 dagen) is het beslismoment."
    },
    {
      "id": "statusafleiding",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "De Jira-status van het initiatief is de waarheid: zeven statussen, één per fase. Geen afleiding uit EAG, POR of PROD en geen wachtstatussen. Afwijkingen met gekoppelde tickets zijn reviewpunten."
    },
    {
      "id": "deadlines",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "Geen captatietermijn, verlenging, wachtklok of prioriteitsbump. De enige klokken zijn 'stilgevallen' (90 dagen) en 'adhoc-te-lang-open' (30 dagen). Rapporten zijn tijdig tot halverwege de volgende periode (de 15e voor een maandrapport)."
    },
    {
      "id": "meting-nota",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "Geen apart label 'meting' of governancenota. Metingen zitten in het vooruitgangsrapport; een governancenota is een verslag, of een beslissing (decisions) als er beslist wordt."
    },
    {
      "id": "gate-implementatie",
      "date": "2026-10-01",
      "by": "Kenzo",
      "rule": "De overgang naar Implementatie vraagt enkel een formele beslissing (decisions)."
    },
    {
      "id": "uitzonderingen",
      "date": "2026-10-04",
      "by": "Kenzo",
      "rule": "Een afwijking van een catalogusregel of gatevoorwaarde (gate:<artefact>) is interne beheerdata in het meetstandenarchief: regel, reden, door wie. Geen spoor in Confluence, Jira of rapporten. Elke gebruiker van de plugin kan ze vastleggen, ook voor regels met ernst error; ingebouwde controles los je op. Een uitzondering wordt bij voorkeur maandelijks herzien; na 3 maanden zonder herziening telt ze niet meer en komt de bevinding terug met 'uitzondering-te-herzien'. Herzien is opnieuw bevestigen; het archief bewaart de geschiedenis."
    }
  ],
  "rules_note": "Regels signaleren. Een ontbrekende gatevoorwaarde vraagt een expliciete, gelogde uitzondering (beslissing uitzonderingen); nooit een stilzwijgende keuze."
}
