id: geen-project
scope: initiatives
severity: warning
when:
  all:
    - {field: soort, op: eq, value: afgebakend}
    - {field: phase, op: in, value: [Planning, Implementatie, Uitvoering, Afbouw]}
    - {field: project_keys, op: empty}
message: Afgebakend initiatief vanaf Planning zonder project (POR-taak of intern project).
action: Koppel de POR-taak in Jira aan het initiatief, of maak ze aan. Een intern project zonder POR-taak vraagt een formele beslissing en een projectpagina (project-page met intern). De plugin volgt enkel Jira-links en projectpagina’s, niet de naam.
