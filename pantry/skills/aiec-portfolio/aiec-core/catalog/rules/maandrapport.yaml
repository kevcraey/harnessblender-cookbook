{
  "id": "maandrapport",
  "scope": "projects",
  "severity": "warning",
  "when": {
    "all": [
      {
        "field": "status",
        "op": "eq",
        "value": "InUitvoering"
      },
      {
        "field": "previous_report",
        "op": "eq",
        "value": false
      }
    ]
  },
  "message": "Vooruitgangsrapport over de vervallen maand niet gevonden: op tijd is tegen de 15de van de volgende maand.",
  "action": "Stel voor de projectleider te mailen. Niet zelf verzenden. Een POR-project heeft geen startdatum: in de eerste helft van de tweede projectmaand kan dit de maand vóór de start zijn. Een intern project rapporteert vanaf de maand van zijn startdatum."
}
