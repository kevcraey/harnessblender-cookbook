id: onderhoud
title: Onderhoudsplan
page_title: "{datum} - onderhoudsplan - {project} - {slug}"
scope: project
label: onderhoudsplan
trigger: Bij afsluiten van een project dat een product (PROD) oplevert of wijzigt, na het laatste vooruitgangsrapport en vóór het eindrapport. Elke versie vervangt de vorige actieve versie van hetzelfde product.
# Klasse, investering en begroting rekent de code uit; de eigenschappen (aiec-onderhoud) zijn de bron voor het portfoliorapport.
maintenance:
  source: vooruitgang

enums:
  duur:
    - {value: 15m, label: 15 minuten}
    - {value: 30m, label: 30 minuten}
    - {value: 1u, label: 1 uur}
    - {value: 4u, label: 4 uur}
    - {value: 1d, label: 1 werkdag}
    - {value: 1w, label: 1 week}
  impact:
    - {value: '1', label: 1 · Geen of verwaarloosbaar}
    - {value: '2', label: 2 · Beperkt}
    - {value: '3', label: 3 · Merkbaar}
    - {value: '4', label: 4 · Groot}
    - {value: '5', label: 5 · Bedreigt het voortbestaan}
  janee:
    - {value: ja, label: Ja}
    - {value: nee, label: Nee}
  kostenpost:
    - {value: hosting, label: Hosting}
    - {value: licenties, label: Licentie}
    - {value: inference, label: Inference}
    - {value: overige, label: Overige}

sections:
  - id: product
    title: Product
    kind: input
    prompt: Voor welk product (PROD-key) geldt dit plan? Enkel nodig als het initiatief meer dan één product heeft.
    required: false

  - id: uitval
    group: Impact van uitval
    title: Impact van uitval
    kind: input_table
    prompt: Wat is de impact op de organisatie als de toepassing zo lang uitvalt? Eén rij per duur, alle zes.
    required: true
    min_rows: 6
    columns:
      - {id: duur, title: Uitval, type: choice, enum: duur, required: true, unique: true}
      - {id: impact, title: Impact, type: choice, enum: impact, required: true}
    help: Schaal 1–5 van de VCDV-informatieclassificatie (beschikbaarheid). De impact mag niet dalen naarmate de uitval langer duurt. De code leidt de klasse af (kritisch, belangrijk of standaard); niemand kiest ze zelf.

  - id: buiten_kantooruren
    group: Impact van uitval
    title: Ondersteuning buiten de kantooruren
    kind: choice
    enum: janee
    prompt: Is ondersteuning buiten de kantooruren nodig?
    required: true

  - id: terugval
    group: Impact van uitval
    title: Terugval bij uitval
    kind: input
    prompt: Wat gebeurt er als de AI uitvalt? Kan het proces handmatig verder, en hoe?
    required: true

  - id: as_is
    group: Begroting
    title: Bestaande investering
    kind: input_table
    prompt: Enkel zonder vorig onderhoudsplan voor dit product. Hoeveel md zit er al in het product (0 bij green field), en wat is de bron? Onbekend? Laat md leeg.
    required: false
    min_rows: 0
    columns:
      - {id: md, title: Investering (md), type: decimal, required: false, empty: onbekend}
      - {id: bron, title: Bron, type: text, required: true}

  - id: runkost
    group: Begroting
    title: Runkost
    kind: input_table
    prompt: Welke jaarlijkse kosten in euro heeft de toepassing, los van onderhoud in mandagen? Eén rij per post, alle vier.
    required: true
    min_rows: 4
    columns:
      - {id: post, title: Post, type: choice, enum: kostenpost, required: true, unique: true}
      - {id: omschrijving, title: Omschrijving, type: text, required: true}
      - {id: bedrag, title: Bedrag (€/jaar), type: decimal, required: true}
    help: Geen kost voor een post? Omschrijving 'Geen.' en bedrag 0. Runkost is geen omrekening van mandagen naar euro.

  - id: modellen
    title: Modellen
    kind: input_table
    prompt: Welke (taal)modellen gebruikt de toepassing, tot wanneer ondersteunt de leverancier die versie, wat is het plan van aanpak daarna, en is er een referentiedataset om een nieuwe versie te toetsen? Geen AI-model? Geef een lege lijst.
    required: true
    min_rows: 0
    columns:
      - {id: component, title: Onderdeel, type: text, required: true}
      - {id: model, title: Model en versie, type: text, required: true}
      - {id: einde, title: Einde ondersteuning, type: text, required: false, empty: onbekend}
      - {id: aanpak, title: Plan van aanpak, type: text, required: true}
      - {id: referentiedataset, title: Referentiedataset, type: choice, enum: janee, required: true}
    help: Plan van aanpak, bijvoorbeeld een upgrade naar een equivalent model. Per model en per jaar telt de onderhoudskost een upgrade van 5 md met referentiedataset, 10 md zonder. Zonder model verschijnt de sectie niet.

  - id: kwaliteit
    title: Kwaliteitsbewaking
    kind: input
    prompt: Hoe wordt de kwaliteit bewaakt? Wie hertest, hoe vaak, en bij welke drempel wordt ingegrepen? Bij een AI-model ook met welke evaluatieset.
    required: true

  - id: afhankelijkheden
    group: Afhankelijkheden
    title: Afhankelijkheden
    kind: input_table
    prompt: Van welke databronnen, API's, diensten, contracten en licenties hangt de toepassing af, en tot wanneer lopen die?
    required: true
    min_rows: 1
    columns:
      - {id: afhankelijkheid, title: Afhankelijkheid, type: text, required: true}
      - {id: einde, title: Loopt tot, type: text, required: false, empty: onbepaald}
    help: Niet de vanzelfsprekende platformen van het departement, zoals hosting, build of het dataplatform. Andere producten (PROD) staan in de lijst hieronder.

  - id: producten
    group: Afhankelijkheden
    title: Producten
    kind: input_table
    prompt: Op welke andere producten (PROD-key) steunt de toepassing, en waarvoor? Geen? Geef een lege lijst.
    required: true
    min_rows: 0
    columns:
      - {id: product, title: Product, type: text, required: true, unique: true}
      - {id: waarvoor, title: Waarvoor, type: text, required: true}
    help: Enkel producten met een PROD-ticket; de code controleert de key en toont de naam. Andere afhankelijkheden horen in de lijst erboven.

  - id: incidenten
    title: Incidenten
    kind: input
    prompt: Waar meldt een gebruiker een incident, en wie behandelt het?
    required: true

  - id: afbouw
    title: Afbouwcriteria
    kind: input
    prompt: Wanneer gaat het product richting Afbouw? Bijvoorbeeld weinig gebruik, een vervallen model, of kosten hoger dan de baten.
    required: true
