id: eindrapport
title: Eindrapport
page_title: "{datum} - eindrapport - {project} - {slug}"
scope: project
label: opleveringsverslag
trigger: Bij afsluiten van een project, na het laatste vooruitgangsrapport en het onderhoudsplan. Bij één project geldt het ook als opleveringsverslag van het initiatief.
properties:
  id: aiec-eindrapport
  sections: [vlag, rijpheid]
# Cijfers, grafieken en milestones komen uit de laatste meetstand van dit rapport; er komt geen nieuwe meetstand bij.
tracking_source:
  report: vooruitgang
  section: wendingen

enums:
  # Zelfde vlaggen en Handy Status-set als het vooruitgangsrapport.
  projectgezondheid:
    - value: op-schema
      label: Op schema
      description: Afgesproken resultaat binnen planning en budget
      handy: {set: 154, status: 686}
    - value: afwijking-geen-actie
      label: Afwijking - Geen actie vereist
      description: Lichte vertraging of milde scopewijziging, zonder ingreep
      handy: {set: 154, status: 687}
    - value: afwijking-actie
      label: Afwijking - Actie vereist
      description: Afgesproken resultaat niet gehaald of duidelijke overschrijding
      handy: {set: 154, status: 688}
  # Zelfde waarden als het kenmerk rijpheid in schema.yaml (test_rijpheid_eindrapport bewaakt dat).
  rijpheid:
    - value: PoC
      label: PoC
      description: Bewijst technische haalbaarheid; wegwerpcode; geen gebruikers
    - value: Prototype
      label: Prototype
      description: Werkt op echte input, wordt gedemonstreerd; niet uitgerold
    - value: MVP
      label: MVP
      description: In productie met minimale scope, echte gebruikers, bekende beperkingen, beheer licht geregeld
    - value: Matuur product
      label: Matuur product
      description: Volwaardig beheer (SLA, monitoring, gevalideerde kwaliteit), breed uitgerold

sections:
  - id: vlag
    title: Eindoordeel
    kind: choice
    enum: projectgezondheid
    prompt: Welke eindvlag kent de projectleider aan het project toe?
    required: true
    help: Een beoordeling van het hele project door de projectleider, met dezelfde vlaggen als het vooruitgangsrapport. De code leidt ze niet af uit de cijfers.

  - id: context
    group: Samenvatting
    title: Context
    kind: input
    prompt: Waarom bestond dit project? Geef aanleiding, doel en opdrachtgever, leesbaar voor wie het project niet kent.
    required: true
    help: De agent stelt een tekst voor uit het captatie- en analyserapport en de Jira-omschrijving; de projectleider bevestigt.

  - id: resultaat
    group: Samenvatting
    title: Resultaat
    kind: input
    prompt: Wat was afgesproken, wat is opgeleverd en wat niet? Geef bij wat niet is opgeleverd ook waarom.
    required: true

  - id: rijpheid
    group: Samenvatting
    title: Rijpheid
    kind: choice
    enum: rijpheid
    prompt: Welke rijpheid heeft het opgeleverde bij het einde van dit project?
    required: true
    help: Rijpheid is geen fase. Een project kan een PoC of prototype opleveren; wat in productie staat is minstens een MVP.

  - id: waarde
    group: Samenvatting
    title: Waarde
    kind: input
    prompt: Wat is gemeten en wat blijft een aanname? Citeer alleen een bevestigde batenclaim, met de aanname.
    required: true
    help: Geen tarief of betrouwbare kostenbron betekent geen eurobedrag. Nog niets gemeten? Zeg dat en wanneer het gemeten wordt.

  - id: wendingen
    group: Verloop
    title: Belangrijkste wendingen
    kind: input
    prompt: Welke 3–5 momenten bepaalden het verloop? Geef per regel wat er gebeurde en wat het gevolg was.
    required: true
    min_lines: 1
    max_lines: 5
    help: De agent stelt een lijst voor uit de wijzigingen en beslissingen van de maandrapporten; de projectleider schrapt en vult aan.

  - id: productverantwoordelijke
    group: Vervolg
    title: Productverantwoordelijke
    kind: input
    prompt: Wie is inhoudelijk verantwoordelijk voor het opgeleverde product, en namens welke afdeling?
    required: true

  - id: beheer
    group: Vervolg
    title: Technisch beheer
    kind: link
    report: onderhoud
    lead: "Team, kritikaliteit, begroting en afspraken voor het beheer staan in het onderhoudsplan:"

  - id: beslissingen
    group: Vervolg
    title: Openstaande beslissingen
    kind: input
    prompt: Welke beslissingen staan nog open, en van wie? Zijn er geen, schrijf dan nee.
    required: true

  - id: vervolgstappen
    group: Vervolg
    title: Vervolgstappen
    kind: input_table
    prompt: Welke vervolgstappen zijn afgesproken, met verantwoordelijke en datum?
    required: true
    min_rows: 1
    columns:
      - id: stap
        title: Stap
        type: text
        required: true
      - id: verantwoordelijke
        title: Verantwoordelijke
        type: text
        required: true
      - id: datum
        title: Tegen
        type: text
        required: true
        help: JJJJ-MM-DD of een maand.
