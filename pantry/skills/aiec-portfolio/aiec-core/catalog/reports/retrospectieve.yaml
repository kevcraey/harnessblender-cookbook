id: retrospectieve
title: Retrospectieve
page_title: "{datum} - retrospectieve - {project} - {slug}"
scope: project
label: retrospectieve
trigger: Op verzoek na projectafsluiting; niet verplicht.

sections:
  # Doel, resultaat, waarde en vervolgafspraken staan in het eindrapport; de retrospectieve verwijst ernaar.
  - id: eindrapport
    title: Eindrapport
    kind: link
    report: eindrapport
    lead: "Doel, resultaat, waarde en vervolgafspraken staan in het eindrapport:"

  - id: goed
    group: Lessons learned
    title: Wat werkte
    kind: input
    prompt: Welke aanpak willen we herhalen, en waarom werkte die?
    required: true

  - id: anders
    group: Lessons learned
    title: Wat moet anders
    kind: input
    prompt: Wat liep anders dan gehoopt, waarom, en wat doen we volgende keer anders?
    required: true
