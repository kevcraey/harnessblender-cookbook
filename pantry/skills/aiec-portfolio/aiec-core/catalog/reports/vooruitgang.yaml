id: vooruitgang
title: Vooruitgang
page_title: "{datum} - vooruitgang - {project} - {slug}"
scope: project
label: vooruitgangsrapport
cadence: monthly
properties:
  id: aiec-vooruitgang
  sections: [vlag]
tracking:
  kind: milestone_effort
  section: milestones
  fields: {id: nr, name: milestone, status: status, baseline: baseline_md, actual: actual_md, remaining: remaining_md}
  delivered: [uitgevoerd]
  backlog: [backlog]
  closed: [niet-uitgevoerd]

# Statussen en vlaggen tonen als Handy Status-macro: globale sets in Confluence, de label is exact de Handy-naam.
enums:
  voortgang:
    - value: backlog
      label: Backlog
      description: Nog niet gestart
      handy: {set: 199, status: 903}
    - value: in-voorbereiding
      label: In Voorbereiding
      description: Lopend werk in voorbereiding
      handy: {set: 199, status: 904}
    - value: lopend
      label: Lopend
      description: In uitvoering
      handy: {set: 199, status: 905}
    - value: uitgevoerd
      label: Uitgevoerd
      description: Opgeleverd
      handy: {set: 199, status: 907}
    - value: niet-uitgevoerd
      label: Niet Uitgevoerd
      description: Afgesloten zonder oplevering; telt niet als opgeleverd
      handy: {set: 199, status: 908}
  projectgezondheid:
    - value: op-schema
      label: Op schema
      description: Voortgang goed, geen grote risico’s; ook voor wat nog niet gestart is
      handy: {set: 154, status: 686}
    - value: afwijking-geen-actie
      label: Afwijking - Geen actie vereist
      description: Lichte vertraging of milde scopewijziging, zonder ingreep
      handy: {set: 154, status: 687}
    - value: afwijking-actie
      label: Afwijking - Actie vereist
      description: Duidelijke risico’s, blockers of vertraging die een ingreep vragen
      handy: {set: 154, status: 688}

sections:
  - id: vlag
    title: Projectgezondheid
    kind: choice
    enum: projectgezondheid
    prompt: Welke gezondheidsvlag kent de projectleider aan het project toe?
    required: true
    help: De vlag is een beoordeling van de projectleider, geen Jira-workflowstatus. Wat nog niet gestart is, staat op schema; er is geen vlag voor onbekend. Licht afwijkingen toe bij de wijzigingen.

  - id: wijzigingen
    title: Belangrijkste wijzigingen sinds het vorige rapport
    kind: input
    prompt: Geef in 2–5 korte regels de belangrijkste wijzigingen. Vermeld gewijzigde risico’s, compliance of batenaannames als die aan de orde zijn. Geen wijzigingen? Zeg dat en geef kort de stand aan.
    required: true
    min_lines: 2
    max_lines: 5

  - id: beslissing
    title: Beslissingen nodig?
    kind: input
    prompt: Welke beslissing is nodig, en van wie? Vermeld zo nodig wanneer. Zijn er geen beslissingen nodig, schrijf dan nee.
    required: true

  - id: milestones
    title: Milestones
    kind: input_table
    prompt: Lever de milestones aan met nummer, voortgang en gezondheidsvlag. Onbekende inspanning blijft leeg; vul niet automatisch nul in.
    required: true
    min_rows: 1
    caption: "md = mandagen. Baseline: oorspronkelijke inschatting, wijzigt niet. Actual: werkelijk besteed tot dit rapport. Remaining: resterend werk. Onbekend is niet nul; de gezondheidsvlag wordt niet berekend."
    help: >-
      Voortgang beschrijft de milestone, Gezondheid is de beoordeling volgens dezelfde vlaggen als het project.
      Actual (md) komt van de projectleider; Remaining (md) is diens actuele inschatting van resterend werk.
      Baseline is de oorspronkelijke inschatting (baseline- of goedgekeurd scopegewicht) en wijzigt nooit; een afwijkende ingevulde Baseline wordt genegeerd met een melding. Actual + Remaining is het verwachte totaal.
      Bij opgeleverd is Remaining nul. Bij backlog is de oorspronkelijke planning het voorstel voor Remaining;
      bij toegevoegde scope met oorspronkelijk plan nul is een expliciete positieve schatting nodig.
      Remaining nul zonder opleverstatus vraagt verduidelijking. Onbekende Actual blijft onbekend.
      Neem geen Jira-worklogs over: als een waarde daar wordt beheerd, blijft Jira de bron.
      Leg de bron of een noodzakelijke uitzondering vast in de notities.
    columns:
      - id: nr
        title: Nr
        type: integer
        minimum: 1
        required: true
        unique: true
      - id: milestone
        title: Milestone
        type: text
        required: true
      - id: status
        title: Voortgang
        type: choice
        enum: voortgang
        required: true
        help: Backlog, In Voorbereiding, Lopend, Uitgevoerd of Niet Uitgevoerd; dit is geen tweede gezondheidsvlag. In Voorbereiding is lopend werk; Niet Uitgevoerd sluit de milestone af zonder oplevering (Remaining 0).
      - id: baseline_md
        title: Baseline (md)
        type: decimal
        minimum: 0
        required: false
        empty: onbekend
      - id: actual_md
        title: Actual (md)
        type: decimal
        minimum: 0
        required: false
        empty: onbekend
      - id: remaining_md
        title: Remaining (md)
        type: decimal
        minimum: 0
        required: false
        empty: onbekend
      - id: gezondheid
        title: Gezondheid
        type: choice
        enum: projectgezondheid
        required: true
      - id: notities
        title: Notities
        type: text
        required: false
        empty: —

  - id: volgende
    title: Volgende periode
    kind: input
    prompt: Wat staat er gepland voor de volgende periode?
    required: true
