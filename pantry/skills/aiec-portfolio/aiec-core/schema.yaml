# schema.yaml — het ene model van het AIEC-portfolio.
# Hieruit volgen het details-blok, de sjabloon- en overzichtspagina, de validatieregels en de
# groepering in rapporten. Wijzig hier; nergens anders staan enums of pijlers.
version: 2

details_id: aiec-initiatief          # ac:parameter "id" van het details-blok (Page Properties)
label: ai-initiatief                 # label op elke initiatiefpagina; cql van de overzichten
page_title: "[{ai_key}] {titel}"     # titel van nieuwe pagina's — te verifiëren tegen bestaande
overview_title: "AI-initiatieven — register"
template_title: "Sjabloon AI-initiatief"

# Artefacten zijn subpagina's met precies één van deze labels. Geen subpagina zonder artefact.
artefact_labels:
  captatierapport: AI-captatierapport (fase Captatie → Analyse)
  analyserapport: AI-analyserapport (fase Analyse → Planning)
  decisions: beslissingsverslag; mechanisme bestaat, toepassing ontbreekt soms
  verslag: overleg- of stuurgroepverslag
  opleveringsverslag: opleveringsverslag (Implementatie → Uitvoering)
  onderhoudsplan: beheer van een operationeel product of dienst
  afbouwplan: gecontroleerd uitfaseren
  dpia: gegevensbeschermingseffectbeoordeling
  advies: advies van DPO, CISO, juridische dienst of architectuur
  vooruitgangsrapport: maandrapport project of kwartaalrapport operationeel initiatief
  meting: meetrapport; labelkeuze nog te bevestigen
  retrospectieve: terugblik na afsluiten van een project; op verzoek, geen verplichte gate
  initiatierapport: EAG-beoordeling Initiatie (Captatie → Analyse), met de beslissing over verkenning
  verkenningsrapport: EAG-beoordeling Verkenning (Analyse → Planning), met de beslissing over het vervolg
  productfiche: fiche van het opgeleverde product (PROD), onder het AI-initiatief

# Vier strategische pijlers plus één cross-cutting. Code is de waarheid in het details-blok; de
# naam mag herformuleerd worden. Set door Kenzo vastgelegd op 2026-09-16; namen en toelichtingen
# bijgewerkt 2026-09-25, gelijk met de vault-note aiec-portfolio-naslag.
# 'grens' staat op de twee pijlers waartussen de keuze fout kan gaan.
pijlers:
  - code: P1
    naam: Fundament & Dataveiligheid
    toelichting: "de technische, beleidsmatige en juridische basis: veilige infrastructuur, eigen getunede modellen, soevereiniteit, privacy, cost management, governance. De voorwaarde waarbinnen teams veilig kunnen bouwen"
  - code: P2
    naam: Mens & Adoptie
    toelichting: cultuur, opleiding, vaardigheden, change management, netwerken zoals de AI Guild. Wie vaardig is en de cultuur omarmt, gebruikt de tooling vanzelf
  - code: P3
    naam: Processen & Productiviteit
    toelichting: "hoe de interne organisatie slimmer en sneller werkt: interne toepassingen, de staart van de backlog, geautomatiseerde administratieve stromen"
    grens: blijft er een mens aan het stuur die elke run start, dan is het productiviteitswinst en dus P3
  - code: P4
    naam: Producten & Dienstverlening
    toelichting: slimme systemen voor medewerkers, burgers, lokale overheden en organisaties. AI als vast onderdeel van de publieke dienstverlening
    grens: worden stappen in het proces zonder menselijke tussenkomst opgestart en uitgevoerd door een AI-systeem, dan is het een slimme oplossing en dus P4
  - code: OMK
    naam: Omkadering
    toelichting: cross-cutting; doorlopende eigen werking van het expertisecentrum
    cross_cutting: true

# Volgorde = fase-volgorde (index 0..6). "jira" is de letterlijke statusnaam op de instance;
# hernoemt Kenzo de statussen, dan wijzigt enkel die kolom.
statussen:
  - jira: Captatie
    naam: Captatie
  - jira: In Analyse
    naam: Analyse
  - jira: Prioritering en planning
    naam: Planning
  - jira: implementatie
    naam: Implementatie
  - jira: Run
    naam: Uitvoering
  - jira: afbouw
    naam: Afbouw
  - jira: Closed
    naam: Afgesloten
    eind: true

# Status van een intern project (zonder POR-taak): dezelfde namen als de Jira-workflow Portfoliotaak
# (live gelezen 2026-09-29), zodat regels zoals maandrapport voor beide projecttypes gelijk werken.
# De projectleider houdt ze zelf bij op de projectpagina (verzoek project-eigenschappen).
project_statussen: [Backlog, In voorbereiding, KlaarVoorUitvoering, InUitvoering, In Review, Uitgevoerd, Stopgezet]

# Jira-resolutions bij Afgesloten (datamodel §3). Categorie → resolution-namen op de instance
# (lijst live gelezen 2026-09-16: 30 namen, geen 'uitgevoerd/stopgezet/geannuleerd'). Welke naam
# bij welke categorie hoort is een VOORSTEL, te bevestigen door Kenzo. Onbekende naam → geen categorie
# → 'geen-stopreden' meldt het initiatief.
resoluties:
  uitgevoerd:
    tekst: volledig uitgevoerd
    jira: [Gerealiseerd, Afgehandeld, Done, Fixed, Goedgekeurd]
  stopgezet:
    tekst: na opstart gestopt
    jira: [Stopgezet, "Wordt niet verder behandeld", Inactief]
  geannuleerd:
    tekst: nooit opgestart
    jira: [Ingetrokken, Declined, "Won't Do", Geweigerd, Dubbel, Duplicate]

# Eigenschappen van een initiatief (rijen van het details-blok, in deze volgorde).
#   key            sleutel in JSON en voorstel-bestanden
#   label          tekst in de eerste kolom van het blok en kolomkop in overzichten
#   type           text | enum | multi | pijler
#   required       altijd verplicht
#   required_when  lijst van voorwaarden die allemaal moeten gelden (soort, fase_min, status,
#                  resolution_not, filled) vóór het veld verplicht is
#   not_inferable  een agent kan dit niet afleiden; blijft leeg met markering KENZO
fields:
  - key: ai_key
    label: AI-key
    groep: Identiteit & plaats
    type: text
    pattern: "^AI-\\d+$"
    required: true
    verborgen: true
    hint: join-sleutel naar Jira; status, uren en kost komen daar live vandaan
  - key: eag_key
    label: EAG-key
    groep: Identiteit & plaats
    type: text
    pattern: "^EAG-\\d+$"
    required_when:
      - soort: afgebakend
    verborgen: true
    hint: counterpart in het centrale demandregister; doorlopende werking heeft er geen
  - key: soort
    label: Soort
    groep: Identiteit & plaats
    type: enum
    values: [afgebakend, doorlopend]
    value_hints:
      afgebakend: een project of opdracht met een einde. Heeft altijd een EAG-counterpart, en dat is de koppeling met het centrale demandproces
      doorlopend: een staande functie zoals ondersteuning, kennisdeling of beheer. Heeft geen EAG-ticket, staat wel in het AIEC-portfolio, en valt buiten de funnel
    required: true
    hint: doorlopend = staande functie (omkadering, kennisdeling, governance); valt buiten de funnel
  - key: pijler
    label: Pijler
    groep: Identiteit & plaats
    type: pijler
    required: true
  - key: vrager
    label: Vrager
    groep: Herkomst
    type: text
    required_when:
      - soort: afgebakend
    hint: persoon die de vraag stelde
  - key: afdeling
    label: Afdeling
    groep: Herkomst
    type: text
    required_when:
      - soort: afgebakend
    hint: afdeling of entiteit van de vrager; filter voor de heatmap
  - key: herkomst
    label: Herkomst
    groep: Herkomst
    type: enum
    values: [bottom-up, management, regelgeving, vendor]
    required_when:
      - soort: afgebakend
  - key: toepassingstype
    label: Toepassingstype
    groep: Classificatie
    type: multi
    values:
      - Conversationele interface
      - Documentverwerking
      - Kennisontsluiting & zoeken
      - Beeld- & sensoranalyse
      - Voorspellen & detecteren
      - Beslissingsondersteuning
      - Procesautomatisering
      - Other
    value_hints:
      "Conversationele interface": chatbot of assistent waarmee gebruikers in dialoog gaan
      "Documentverwerking": extractie, samenvatting, classificatie of generatie van documenten en teksten
      "Kennisontsluiting & zoeken": kennisbronnen doorzoekbaar maken, semantisch zoeken, RAG
      "Beeld- & sensoranalyse": "beelden, video of sensordata interpreteren: monitoring, herkenning, telling"
      "Voorspellen & detecteren": forecasting, planning, anomalie- en inbreukdetectie, controle
      "Beslissingsondersteuning": advies, prioritering of triage ter ondersteuning van een menselijke beslissing
      "Procesautomatisering": workflow-stappen automatiseren, inclusief developer tooling
      "Other": toepassing die hier niet in past, te specificeren
    required_when:
      - soort: afgebakend
      - fase_min: Planning
    notice_when_v2:
      all:
        - {field: soort, op: eq, value: afgebakend}
        - {field: phase, op: eq, value: Analyse}
  - key: ai_techniek
    label: AI-techniek
    groep: Classificatie
    type: multi
    values:
      - Generative AI
      - Agentic AI
      - NLP
      - Computer Vision
      - Classification
      - Regression
      - Clustering
      - Anomaly detection
      - Time series forecasting
      - Recommender system
      - Reinforcement learning
      - Other
    value_hints:
      "Generative AI": genereert nieuwe content (tekst, beeld, code) op basis van grote voorgetrainde modellen
      "Agentic AI": plant en voert zelfstandig meerstapstaken uit, met tools en externe systemen
      "NLP": "verwerken en begrijpen van natuurlijke taal: extractie, vertaling, sentiment, entiteitsherkenning"
      "Computer Vision": "interpreteren van beelden of video: objectdetectie, beeldclassificatie, OCR"
      "Classification": items toewijzen aan vooraf gedefinieerde categorieën, zoals dossier wel of niet ontvankelijk
      "Regression": een numerieke waarde voorspellen op basis van historische data, zoals een kostenraming
      "Clustering": gelijkaardige items groeperen zonder vooraf gedefinieerde categorieën, zoals argumenten in bezwaarschriften
      "Anomaly detection": afwijkingen van een normaalpatroon detecteren, zoals meetfouten of fraude-indicaties
      "Time series forecasting": toekomstige waarden voorspellen uit tijdreeksen, zoals waterstanden of verkeersvolumes
      "Recommender system": relevante items suggereren op basis van gedrag of kenmerken
      "Reinforcement learning": het model leert optimaal gedrag door beloning of straf in een omgeving, zoals bij optimalisatievraagstukken
      "Other": techniek die hier niet in past, te specificeren
    required_when:
      - soort: afgebakend
      - fase_min: Planning
    notice_when_v2:
      all:
        - {field: soort, op: eq, value: afgebakend}
        - {field: phase, op: eq, value: Analyse}
  - key: delivery_mode
    label: Delivery-mode
    groep: Classificatie
    type: enum
    values: [eigen bouw, extern/vendor, AI-feature in COTS, hergebruik intern]
    required_when:
      - soort: afgebakend
      - fase_min: Planning
  - key: ai_act_klasse
    label: AI Act-klasse
    groep: Risico
    type: enum
    values: [verboden, hoog, beperkt, minimaal, te bepalen, niet van toepassing]
    required: true
    hint: "'te bepalen' mag tot en met Analyse; vanaf Planning wordt het gemeld"
  - key: persoonsgegevens
    label: Persoonsgegevens
    groep: Risico
    type: enum
    values: [ja, nee, onbekend, niet van toepassing]
    required: true
    hint: ja → DPO betrekken (artefact, geen veld)
  - key: batenclaim
    label: Batenclaim
    groep: Waarde
    type: text
    not_inferable: true
    required_when:
      - soort: afgebakend
      - fase_min: Planning
    hint: één claim in manuren per jaar, geen euro's
  - key: aanname
    label: Aanname
    groep: Waarde
    type: text
    not_inferable: true
    required_when:
      - filled: batenclaim
    hint: de veronderstelling onder de claim (volume × tijd per stuk)
  - key: opgeleverd
    label: Opgeleverd
    groep: Waarde
    type: text
    required_when:
      - fase_min: Uitvoering
    hint: wat er effectief staat (product, dienst, beleid)
  - key: gebruikers
    label: Gebruikers
    groep: Waarde
    type: text
    required_when:
      - fase_min: Uitvoering
    hint: wie het gebruikt (afdelingen, aantallen als bekend)
  # Rijpheid is geen fase: ze zegt hoe af de oplossing is, de fase waar het initiatief staat.
  # Terminologie door Kenzo vastgelegd op 2026-09-29.
  - key: rijpheid
    label: Rijpheid
    groep: Waarde
    type: enum
    values: [PoC, Prototype, MVP, Matuur product]
    value_hints:
      PoC: bewijst technische haalbaarheid; wegwerpcode; geen gebruikers
      Prototype: werkt op echte input, wordt gedemonstreerd; niet uitgerold
      MVP: in productie met minimale scope, echte gebruikers, bekende beperkingen, beheer licht geregeld
      Matuur product: volwaardig beheer (SLA, monitoring, gevalideerde kwaliteit), breed uitgerold
    required_when:
      - fase_min: Uitvoering
    hint: huidige rijpheid van wat er staat, geen fase; stijgt met vervolgprojecten
  - key: stopreden
    label: Stopreden
    groep: Afsluiting
    type: enum
    values:
      - geen capaciteit
      - geen business owner
      - geen data
      - technisch niet haalbaar
      - geen meerwaarde
      - risico of regelgeving
      - overgenomen door ander traject
      - andere
    required_when:
      - status: Afgesloten
      - resolution_not: uitgevoerd
    verborgen: true           # staat in het verborgen kenmerkenblok (hidden=true, zelfde id)
    hint: categorie voor de funnel-analyse; de beslissing zelf is een artefact met label decisions

# Vaste onderdelen van een initiatiefpagina, in paginavolgorde. type bepaalt de macro;
# type details is het kenmerkenblok: een zichtbaar blok plus een verborgen blok (hidden=true,
# zelfde id) voor velden met verborgen: true.
page_sections:
  - kop: Stand van zaken
    type: jira-issue          # jira-macro op de AI-key en de gekoppelde tickets (EAG, POR, PROD, …)
  - kop: Eigenschappen
    type: details
  - kop: Waarover gaat het
    type: tekst
    placeholder: probleem en beoogde oplossing in twee of drie zinnen
  - kop: Artefacten
    type: artefacten          # content-by-label: gekende artefactlabels onder deze pagina, ook onder projectpagina's
    exclude: [decisions]      # beslissingen hebben een eigen overzicht
  - kop: Beslissingen
    type: detailssummary      # cql: label = "decisions" and ancestor = currentContent()
    label: decisions
    headings: [Overgang naar, Datum, Beslist door]   # = rijlabels van het eigenschappenblok op een beslissing

# Overzichtspagina: per pijler een detailssummary met deze kolommen, plus één Jira-macro.
# Page Properties Report filtert op pagina's (cql), niet op celwaarden: dus één rapport met Pijler
# als eerste kolom en daarop gesorteerd, plus één Jira-macro voor status.
overzicht:
  kolommen: [pijler, soort, afdeling, ai_act_klasse, persoonsgegevens, eag_key]
  sorteer: pijler
  jira_jql: "project = AI AND issuetype = Initiative ORDER BY key"
  jira_kolommen: [key, summary, status, assignee, updated]
