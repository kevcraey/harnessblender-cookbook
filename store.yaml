# Externe bronnen die harnessblender kan halen ("store items"). Elke `name` wordt
# gekloond naar `store/<name>/` (gitignored) — `harnessblender fetch` doet clone-als-
# nog-niet-aanwezig, en ff-only pull als de checkout al bestaat.
#
# LET OP: `marky` (was git@github.com... lavish-axi) ontbreekt hier — de map was
# tijdens deze migratie al verdwenen uit `external/` (niet door harnessblender
# verwijderd, gewoon niet meer aangetroffen). Voeg terug toe met zijn url als je
# hem nog nodig hebt.
