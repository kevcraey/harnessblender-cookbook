    url: https://github.com/herdrdev/herdr.git
  - name: mattpocock
    url: git@github.com:mattpocock/skills.git
  - name: obsidian-skills
    url: https://github.com/kepano/obsidian-skills.git
  - name: team-decibel
    url: ssh://git@git.omgeving.vlaanderen.be:2222/git/development/team-decibel.git
  - name: codebase-memory-mcp
    url: git@github.com:DeusData/codebase-memory-mcp.git
